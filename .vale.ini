# The configs the README tells you to write, one per fixture, with the
# package's styles read from the tree instead of a sync.
StylesPath = Fiction/styles
MinAlertLevel = suggestion

[{fixtures,fixtures/clean}/story.md]
BasedOnStyles = Fiction, Leonard, Palahniuk, Strunk, Orwell, Narration, Hemingway

# The fixtures are a few hundred words, so the chapter band is narrowed to
# fire on the prologue and the last chapter and not on the clean rewrite.
Fiction.ChapterLength[condition] = "< 100 || result > 200"

# Plain text has no headings, so the rules that read the title or a
# heading never fire here; everything else does.
[{fixtures,fixtures/clean}/story.txt]
BasedOnStyles = Fiction, Leonard, Palahniuk, Strunk, Orwell, Narration, Hemingway
