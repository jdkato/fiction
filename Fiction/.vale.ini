# The core is on by default: the checks most fiction editors agree on. Name
# an author's rules beside it in your own config:
#
#   [*.md]
#   BasedOnStyles = Fiction, Leonard, Palahniuk
#
# Strunk is the 1918 Elements of Style, for prose of any kind.
MinAlertLevel = suggestion

[*.{md,txt,org,rst,adoc}]
BasedOnStyles = Fiction
