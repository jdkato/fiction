# The Hemingway Editor's blue: an adverb, "a description of a verb, like
# 'quickly'", where a stronger verb would do the work alone. Any word
# ending in -ly is read as one, less the adjectives and nouns that happen
# to end the same way. Speech is left alone; people talk this way.
extends: existence
message: "Adverb '%s'. Find the verb that doesn't need it."
link: https://hemingwayapp.com/help/docs/highlighted-issues
level: suggestion
scope: ~quote
ignorecase: true
tokens:
  - '\w{2,}ly'
