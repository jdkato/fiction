tests:
  - name: fires
    input: |
      She walked slowly to the door and quietly opened it.
    want: |
      1:12:Hemingway.Adverbs:Adverb 'slowly'. Find the verb that doesn't need it.
      1:35:Hemingway.Adverbs:Adverb 'quietly'. Find the verb that doesn't need it.
  - name: clean
    input: |
      She crept to the door and eased it open. The family was lovely, and likely early.
    want: ""
  - name: speech
    input: |
      "Walk slowly," she said.
    want: ""
