# From the essay's footnote: "One can cure oneself of the not un-
# formation by memorizing this sentence: A not unblack dog was chasing a
# not unsmall rabbit across a not ungreen field."
extends: existence
message: "Cure the 'not un-' formation: '%s' (Rule 3)."
link: https://www.orwellfoundation.com/the-orwell-foundation/orwell/essays-and-other-works/politics-and-the-english-language/
level: suggestion
ignorecase: true
tokens:
  - not un(?!til\b|der\b|less\b|to\b|ion|it\b|its\b|iform|ique|ivers|iversity)\w+

tests:
  - name: fires
    input: |
      A not unblack dog was chasing a not unsmall rabbit, not until dark.
    want: |
      1:3:Orwell.NotUn:Cure the 'not un-' formation: 'not unblack' (Rule 3).
      1:33:Orwell.NotUn:Cure the 'not un-' formation: 'not unsmall' (Rule 3).
  - name: clean
    input: |
      A black dog was chasing a small rabbit, not until dark.
    want: ""
